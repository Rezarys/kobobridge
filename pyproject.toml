[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kobobridge"
version = "0.1.1"
description = "Serve an Audiobookshelf ebook library to a Kobo eReader over the native sync protocol."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Younes Z." }]
requires-python = ">=3.9"
keywords = [
  "kobo",
  "audiobookshelf",
  "ebook",
  "epub",
  "selfhosted",
  "sync",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
  "flask>=2.2",
  "requests>=2.28",
  "waitress>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kobobridge = "kobobridge.__main__:main"

[project.urls]
Homepage = "https://github.com/Rezarys/kobobridge"
Source = "https://github.com/Rezarys/kobobridge"
Issues = "https://github.com/Rezarys/kobobridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kobobridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
